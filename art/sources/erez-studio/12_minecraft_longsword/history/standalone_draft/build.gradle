plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

group = 'dev.erez.arms'
version = mod_version
base { archivesName = 'erez-arms-neoforge-1.21.1' }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version
    runs {
        client {
            client()
            gameDirectory = project.file('run/client')
        }
        data {
            data()
            gameDirectory = project.file('run/data')
            programArguments.addAll '--mod', project.mod_id, '--all', '--validate',
                '--output', file('build/datagen').absolutePath,
                '--existing', file('src/main/resources').absolutePath
        }
    }
    mods {
        erez_arms { sourceSet sourceSets.main }
    }
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.named('jar') {
    manifest.attributes('Implementation-Title': 'EREZ Arms', 'Implementation-Version': project.version)
}
