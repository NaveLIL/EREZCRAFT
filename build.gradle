['progressionCreate', 'progressionReload'].each { runName -> tasks.named('prepare' + runName.capitalize() + 'Run') {
    outputs.upToDateWhen { false }
    doLast {
        if (!providers.gradleProperty('intersticeRunRoot').isPresent()) throw new GradleException('New isolated verification root required')
        def target = neoForge.runs.getByName(runName).gameDirectory.get().asFile
        def source = file(providers.gradleProperty('progressionPackSource').get())
        if (!source.toPath().toRealPath().toString().replace('\\','/').contains('/.verification/')) throw new GradleException('Owned pack source required')
        def jars = fileTree(new File(source,'mods')) { include '*.jar' }.files
        if (jars.size() != 79) throw new GradleException('Expected alpha.18 79-JAR client')
        jars.each { jar ->
            def archive = new java.util.zip.ZipFile(jar)
            boolean supplied
            try {
                def entry = archive.getEntry('META-INF/neoforge.mods.toml') ?: archive.getEntry('META-INF/mods.toml')
                def metadata = entry ? archive.getInputStream(entry).getText('UTF-8') : ''
                supplied = (metadata =~ /modId\s*=\s*["'](?:interstice|lootr|distanthorizons|smartbrainlib|azurecortex)["']/).find()
            } finally { archive.close() }
            if (!supplied) copy { from jar; into new File(target,'mods') }
        }
        if (runName == 'progressionCreate') {
            if (new File(target,'saves').exists()) throw new GradleException('New progression profile required')
            ['config','defaultconfigs','resourcepacks','shaderpacks'].each { folder -> copy { from new File(source,folder); into new File(target,folder) } }
            new File(target,'options.txt').text='onboardAccessibility:false\nlang:ru_ru\ntutorialStep:none\nrenderDistance:3\nsimulationDistance:5\nguiScale:2\nmaxFps:60\nfullscreen:false\npauseOnLostFocus:false\nresourcePacks:["mod_resources","file/erezcraft-ru-mc1.21.1.zip"]\n'
            new File(target,'config/fml.toml').text='earlyWindowControl = false\n'
        }
    }
} }

// Full production client binaries, read-only source; never copy an owner's world or options.
tasks.named('prepareSpiderMovementSmokeRun') {
    outputs.upToDateWhen { false }
    doLast {
        def target = neoForge.runs.spiderMovementSmoke.gameDirectory.get().asFile
        if (!target.toPath().toAbsolutePath().toString().replace('\\','/').contains('/.verification/')) throw new GradleException('Owned verification profile required')
        if (new File(target,'saves').exists()) throw new GradleException('A new full-client profile is required')
        def source = file(providers.gradleProperty('spiderPackSource').get())
        def jars = fileTree(new File(source,'mods')) { include '*.jar' }.files
        if (jars.size()!=65) throw new GradleException('Expected current 65-JAR client')
        jars.findAll { !it.name.startsWith('interstice-') && !it.name.startsWith('DistantHorizons-') && !it.name.startsWith('lootr-') }.each { jar ->
            copy { from jar; into new File(target,'mods') }
        }
        copy { from new File(source,'config'); into new File(target,'config') }
        copy { from new File(source,'defaultconfigs'); into new File(target,'defaultconfigs') }
        new File(target,'config/fml.toml').text='earlyWindowControl = false\n'
        new File(target,'options.txt').text='onboardAccessibility:false\nlang:ru_ru\ntutorialStep:none\nrenderDistance:8\nsimulationDistance:5\n'
    }
}
