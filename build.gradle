    mustRunAfter tasks.named('runProgressionCreate')
    doFirst {
        def proof = new File(neoForge.runs.getByName('progressionReload').gameDirectory.get().asFile, 'progression-create.json')
        if (!proof.isFile() || new groovy.json.JsonSlurper().parse(proof).passed != true)
            throw new GradleException('Native creation did not pass; do not launch a redundant reload')
    }
