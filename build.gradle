tasks.named('runAgricultureReload') { dependsOn tasks.named('runAgricultureCreate') }
tasks.register('runAgricultureSmoke') { dependsOn tasks.named('runAgricultureReload') }
tasks.matching { it.name in ['prepareLivingRealmCreateRun','prepareLivingRealmReloadRun','prepareMiningCreateRun','prepareMiningReloadRun','prepareHydrologySmokeRun','prepareAgricultureCreateRun','prepareAgricultureReloadRun','prepareAgriculturePropsSmokeRun'] }.configureEach {
    outputs.upToDateWhen { false }
    doLast {
        def runName=it.name.contains('AgricultureProps') ? 'agriculturePropsSmoke' : it.name.contains('Agriculture') ? (it.name.contains('Reload')?'agricultureReload':'agricultureCreate') : it.name.contains('Hydrology') ? 'hydrologySmoke' : it.name.contains('Mining') ? (it.name.contains('Reload')?'miningReload':'miningCreate') : (it.name.contains('Reload')?'livingRealmReload':'livingRealmCreate')
        def directory=neoForge.runs.getByName(runName).gameDirectory.get().asFile
        def config=new File(directory,'config/fml.toml');config.parentFile.mkdirs();config.text='earlyWindowControl = false\n'
        def options=new File(directory,'options.txt');if(!options.exists())options.text='onboardAccessibility:false\n'+(it.name.contains('Agriculture')?'lang:ru_ru\ntutorialStep:none\n':'')
    }
}

tasks.matching { it.name in ['prepareWatchpostPersistenceCreateRun', 'prepareWatchpostPersistenceReloadRun', 'prepareVaultPersistenceCreateRun', 'prepareVaultPersistenceReloadRun', 'prepareGardenPersistenceCreateRun', 'prepareGardenPersistenceReloadRun', 'prepareCrownFoodCreateRun', 'prepareCrownFoodReloadRun'] }.configureEach {
    outputs.upToDateWhen { false }
    doLast {
        def runName = it.name.contains('CrownFood') ? (it.name.contains('Reload') ? 'crownFoodReload' : 'crownFoodCreate') :
                it.name.contains('Garden') ? (it.name.contains('Reload') ? 'gardenPersistenceReload' : 'gardenPersistenceCreate') :
                it.name.contains('Vault') ? (it.name.contains('Reload') ? 'vaultPersistenceReload' : 'vaultPersistenceCreate') :
                (it.name.contains('Reload') ? 'watchpostPersistenceReload' : 'watchpostPersistenceCreate')
        def directory = neoForge.runs.getByName(runName).gameDirectory.get().asFile
        def config = new File(directory, 'config/fml.toml')
        config.parentFile.mkdirs()
        config.text = 'earlyWindowControl = false\n'
        def options = new File(directory, 'options.txt')
        if (!options.exists()) options.text = 'onboardAccessibility:false\n'
    }
}
tasks.matching { it.name in ['prepareSurvivalRouteBootstrapRun', 'prepareSurvivalRouteEquipmentRun', 'prepareSurvivalEquipmentResumeRun', 'prepareSurvivalOresRun', 'prepareSurvivalToolRepairRun', 'prepareSurvivalForgeRun', 'prepareSurvivalEntranceRun', 'prepareSurvivalTideRouteRun', 'prepareSurvivalRuinRun', 'prepareSurvivalPortalRun'] }.configureEach {
    outputs.upToDateWhen { false }
    doLast {
        def runName = it.name.contains('Portal') ? 'survivalPortal' : it.name.contains('Ruin') ? 'survivalRuin' : it.name.contains('TideRoute') ? 'survivalTideRoute' : it.name.contains('Entrance') ? 'survivalEntrance' : it.name.contains('Forge') ? 'survivalForge' : it.name.contains('ToolRepair') ? 'survivalToolRepair' : it.name.contains('Ores') ? 'survivalOres' : it.name.contains('Resume') ? 'survivalEquipmentResume' : it.name.contains('Equipment') ? 'survivalRouteEquipment' : 'survivalRouteBootstrap'
        def directory = neoForge.runs.getByName(runName).gameDirectory.get().asFile
        def config = new File(directory, 'config/fml.toml')
        config.parentFile.mkdirs(); config.text = 'earlyWindowControl = false\n'
        def options = new File(directory, 'options.txt')
        if (!options.exists()) options.text = 'onboardAccessibility:false\n'
    }
}
