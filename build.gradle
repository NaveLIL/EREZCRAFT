// Verification always supplies a newly created root. Ordinary existing profiles keep their paths.
if (providers.gradleProperty('intersticeRunRoot').isPresent()) {
    neoForge.runs.configureEach {
        def profileName = name in ['agricultureCreate','agricultureReload'] ? 'agricultureSmoke' : name in ['miningCreate','miningReload'] ? 'miningSmoke' : name in ['livingRealmCreate','livingRealmReload'] ? 'livingRealm' : name in ['crownFoodCreate', 'crownFoodReload'] ? 'crownFood' :
                name in ['gardenPersistenceCreate', 'gardenPersistenceReload'] ? 'gardenPersistence' :
                name in ['vaultPersistenceCreate', 'vaultPersistenceReload'] ? 'vaultPersistence' :
                name in ['persistenceCreate', 'persistenceReload'] ? 'persistenceSmoke' :
                name in ['riftPersistenceCreate', 'riftPersistenceReload'] ? 'riftPersistence' :
                name in ['keyPersistenceCreate', 'keyPersistenceReload'] ? 'keyPersistence' :
                name in ['watchpostPersistenceCreate', 'watchpostPersistenceReload'] ? 'watchpostPersistence' :
                name in ['survivalRouteBootstrap', 'survivalRouteEquipment', 'survivalEquipmentResume', 'survivalOres', 'survivalToolRepair', 'survivalForge', 'survivalEntrance', 'survivalTideRoute', 'survivalRuin', 'survivalPortal'] ? 'survivalRoute' : name
        gameDirectory = file(providers.gradleProperty('intersticeRunRoot').get() + '/' + profileName)
    }
}
processResources {
    inputs.property 'version', project.version
    filesMatching('META-INF/neoforge.mods.toml') { expand version: project.version }
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
// Avoid a race in NeoForge's early loading-window font initialization on macOS.
// This affects only the disposable visual-test profile, not the installed game.
tasks.matching { it.name in ['prepareClientSmokeRun', 'prepareIslandSmokeRun', 'prepareTallIslandSmokeRun', 'prepareIslandPreviewRun', 'preparePlaytestRun', 'prepareFloraSmokeRun', 'prepareWatchpostSmokeRun', 'prepareKeyPersistenceCreateRun', 'prepareKeyPersistenceReloadRun', 'prepareRiftPersistenceCreateRun', 'prepareRiftPersistenceReloadRun', 'prepareGeometrySmokeRun', 'preparePersistenceCreateRun', 'preparePersistenceReloadRun'] }.configureEach {
    // A different verification root needs its own onboarding/config files even if launch arguments are unchanged.
    outputs.upToDateWhen { false }
    doLast {
        def runName = it.name.substring('prepare'.length(), it.name.length() - 'Run'.length())
        runName = runName[0].toLowerCase() + runName.substring(1)
        def directory = neoForge.runs.getByName(runName).gameDirectory.get().asFile
        def config = new File(directory, 'config/fml.toml')
        config.parentFile.mkdirs()
        config.text = config.exists()
                ? config.text.replace('earlyWindowControl = true', 'earlyWindowControl = false')
                : 'earlyWindowControl = false\n'
        def options = new File(directory, 'options.txt')
        if (!options.exists()) options.text = 'onboardAccessibility:false\n'
    }
}
// Two different Minecraft JVMs, one fixture created exclusively for this check.
tasks.named('runPersistenceReload') { dependsOn tasks.named('runPersistenceCreate') }
tasks.register('runPersistenceSmoke') { dependsOn tasks.named('runPersistenceReload') }
