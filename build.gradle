plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}
version = project.mod_version
group = project.maven_group
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
java.withSourcesJar()
sourceSets {
    smoke {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
    infection {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
    geometryFixture {
        compileClasspath += sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.runtimeClasspath
    }
    componentGameTests {
        // Only the upstream renderer is excluded from the artificial GameTestServer.
        // All compiled Interstice tests and NeoForge dependencies remain available.
        runtimeClasspath = sourceSets.smoke.runtimeClasspath.filter { it.name != 'uCdwusMi-9w34y8ai.jar' }
    }
    componentInfectionGameTests {
        runtimeClasspath = sourceSets.infection.runtimeClasspath.filter { it.name != 'uCdwusMi-9w34y8ai.jar' }
    }
}
configurations {
    distantHorizonsArtifact
    smokeImplementation.extendsFrom implementation
    smokeCompileOnly.extendsFrom compileOnly
    smokeRuntimeOnly.extendsFrom runtimeOnly
    infectionImplementation.extendsFrom implementation
    infectionCompileOnly.extendsFrom compileOnly
    infectionRuntimeOnly.extendsFrom runtimeOnly
}
repositories {
    exclusiveContent {
        forRepository { maven { name = 'Modrinth'; url = 'https://api.modrinth.com/maven' } }
        filter { includeGroup 'maven.modrinth' }
    }
}
def sporeArtifact = file(providers.gradleProperty('sporeJar').getOrElse('research/spore/spore_1.21.1_2.2.0j_neo-original.jar'))
dependencies {
    // Required pack renderer. An external upstream mod, never shaded or reimplemented.
    distantHorizonsArtifact('maven.modrinth:uCdwusMi:9w34y8ai') { transitive = false }
    runtimeOnly('maven.modrinth:uCdwusMi:9w34y8ai') { transitive = false }
    smokeCompileOnly('maven.modrinth:uCdwusMi:9w34y8ai') { transitive = false }
    // The original third-party binary belongs only to the isolated probe classpath.
    infectionCompileOnly files(sporeArtifact)
    infectionRuntimeOnly files(sporeArtifact)
}
def verifyDistantHorizonsArtifact = tasks.register('verifyDistantHorizonsArtifact') {
    doLast {
        def artifact = configurations.distantHorizonsArtifact.singleFile
        def digest = java.security.MessageDigest.getInstance('SHA-512')
        artifact.withInputStream { input ->
            byte[] buffer = new byte[1024 * 1024]; int length
            while ((length = input.read(buffer)) > 0) digest.update(buffer, 0, length)
        }
        def expected = 'd14b32d3fd143a06514d6ad388eee11e9d657c84e1a937aaf8d033b1137fb43ef8b05cff1011a994cc42f3106823c51234f8bc18d72bb05bc317a20ea83c50ed'
        if (digest.digest().encodeHex().toString() != expected) throw new GradleException('Distant Horizons 3.3.3 upstream SHA-512 mismatch')
        logger.lifecycle('Verified mandatory Distant Horizons 3.3.3 / MC1.21.1 / NeoForge: ' + artifact.name)
    }
}
tasks.named('assemble') { dependsOn verifyDistantHorizonsArtifact }
def verifySporeArtifact = tasks.register('verifySporeArtifact') {
    doLast {
        if (!sporeArtifact.isFile()) throw new GradleException('Obtain the original Spore 2.2.0j NeoForge JAR; see docs/progress/M01.md or use -PsporeJar=/path/to/original.jar')
        def digest = java.security.MessageDigest.getInstance('SHA-256')
        sporeArtifact.withInputStream { input ->
            byte[] buffer = new byte[1024 * 1024]
            int length
            while ((length = input.read(buffer)) > 0) digest.update(buffer, 0, length)
        }
        def actual = digest.digest().encodeHex().toString()
        if (actual != '0cdb027eb53e6872bdb8de601dc52c176fcb6ddd33a0a2e20a66392937c3d5fe')
            throw new GradleException('Spore original SHA-256 mismatch: ' + actual)
        logger.lifecycle('Verified original Spore 2.2.0j SHA-256: ' + actual)
    }
}
