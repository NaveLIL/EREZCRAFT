        run.sourceSet = run.name == 'infectionGameTestServer' ? sourceSets.componentInfectionGameTests : sourceSets.componentGameTests
    } else {
        if (run.type.get() == 'client') {
            if (providers.gradleProperty('intersticeVerificationGc').getOrElse('ZGC') == 'G1') {
                if (!providers.gradleProperty('intersticeRunRoot').isPresent()) throw new GradleException('Diagnostic G1 requires an isolated verification root')
