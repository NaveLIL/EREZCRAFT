tasks.matching { it.name in ['prepareTechmagicSpineSmokeRun','prepareTechmagicFoundationSmokeRun','prepareTechmagicFoundationServerRun','prepareTechmagicPregenCreateRun','prepareTechmagicPregenReloadRun'] }.configureEach {
    outputs.upToDateWhen { false }
    doLast {
        def pregen=it.name.contains('Pregen')
        def runName=pregen?(it.name.contains('Reload')?'techmagicPregenReload':'techmagicPregenCreate'):it.name.contains('FoundationServer')?'techmagicFoundationServer':it.name.contains('Foundation')?'techmagicFoundationSmoke':'techmagicSpineSmoke'
        def dedicated=pregen||runName=='techmagicFoundationServer'
        def directory=neoForge.runs.getByName(runName).gameDirectory.get().asFile
        if (!directory.toPath().toAbsolutePath().toString().replace('\\','/').contains('/.verification/')) throw new GradleException('Spine verification profile must be isolated')
        def lock=new groovy.json.JsonSlurper().parse(file('distribution/techmagic-spine.lock.json'))
        lock.required_spine.findAll { it.project in ['create','create-aeronautics','sable'] }.each { mod ->
            def input=file('research/dependencies/'+mod.filename)
            if (!input.isFile()) throw new GradleException('First resolve pinned spine artifact: '+mod.filename)
            def actual=java.security.MessageDigest.getInstance('SHA-512').digest(input.bytes).encodeHex().toString()
            if(actual!=mod.sha512)throw new GradleException('Spine SHA-512 mismatch: '+mod.filename)
            copy { from input; into new File(directory,'mods') }
        }
        if(runName.startsWith('techmagicFoundation')||pregen){
            def foundation=new groovy.json.JsonSlurper().parse(file('distribution/server-foundation.lock.json'))
            foundation.mods.each { mod ->
                if(dedicated&&mod.role in ['minimap','worldmap'])return
                def input=file('research/dependencies/'+mod.filename)
                if(!input.isFile())throw new GradleException('Missing foundation artifact: '+mod.filename)
                if(java.security.MessageDigest.getInstance('SHA-512').digest(input.bytes).encodeHex().toString()!=mod.sha512)throw new GradleException('Foundation SHA-512 mismatch: '+mod.filename)
                copy { from input; into new File(directory,'mods') }
            }
        }
        def config=new File(directory,'config/fml.toml');config.parentFile.mkdirs();config.text='earlyWindowControl = false\n'
        copy { from 'distribution/DistantHorizons.toml'; into new File(directory,'config') }
        def options=new File(directory,'options.txt');if(!options.exists())options.text='onboardAccessibility:false\nlang:ru_ru\ntutorialStep:none\n'
        if(dedicated){
            def world=new File(directory,'foundation-check/level.dat')
            if(runName=='techmagicPregenReload'){if(!world.exists())throw new GradleException('Pregen reload requires the earlier saved world')}
            else if(world.exists())throw new GradleException('Foundation/pregen create requires a NEW verification root')
            new File(directory,'eula.txt').text='eula=true\n'
            new File(directory,'server.properties').text='server-ip=127.0.0.1\nserver-port=26605\nonline-mode=false\nallow-flight=false\nview-distance=4\nsimulation-distance=4\nlevel-name=foundation-check\nlevel-seed=20261006\nmax-players=10\nwhite-list=true\n'
        }
    }
}
